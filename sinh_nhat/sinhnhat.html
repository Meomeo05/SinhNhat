<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chúc mừng sinh nhật</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Be+Vietnam+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#23102e; --bg2:#3b1a45; --glow:#ffd37a; --berry:#ff5d7a; --cream:#fff1e6; --lilac:#c9b8ff;
  --ink:#fff1e6; --muted:#d9c6e6;
  --script:"Dancing Script","Brush Script MT",cursive; --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 30%,var(--bg2),var(--bg) 70%);color:var(--ink);font-family:var(--sans);overflow-x:hidden}
main{max-width:560px;margin:0 auto;padding:28px 20px 48px;text-align:center}
h1{font-family:var(--script);font-size:clamp(2.4rem,9vw,3.6rem);margin:8px 0 6px;line-height:1.1}
.hint{color:var(--muted);margin:0 0 6px;min-height:1.5em;transition:opacity .4s}

/* cake */
.cake{position:relative;width:260px;height:250px;margin:70px auto 10px}
.plate{position:absolute;bottom:0;left:-20px;right:-20px;height:16px;border-radius:50%;background:var(--lilac);opacity:.85}
.layer{position:absolute;left:0;right:0;border-radius:14px}
.l1{bottom:8px;height:100px;background:var(--berry)}
.l2{bottom:108px;left:36px;right:36px;height:80px;background:var(--cream);border-radius:14px 14px 10px 10px}
.drip{position:absolute;left:0;right:0;top:0;height:26px;background:var(--cream);border-radius:14px 14px 0 0}
.l1 .drip{background:#ff8aa0}
.drip::after{content:"";position:absolute;left:0;right:0;top:20px;height:16px;
  background:radial-gradient(circle at 12px 0,inherit 11px,transparent 12px) 0 0/34px 16px repeat-x}
.l1 .drip::after{background:radial-gradient(circle at 12px 0,#ff8aa0 11px,transparent 12px) 0 0/34px 16px repeat-x}
.l2 .drip::after{background:radial-gradient(circle at 12px 0,var(--cream) 11px,transparent 12px) 0 0/34px 16px repeat-x}
.dots{position:absolute;inset:44px 14px 10px;background:radial-gradient(circle,var(--glow) 3px,transparent 4px) 0 0/28px 26px}

/* candles */
.candles{position:absolute;left:44px;right:44px;bottom:188px;height:0;display:flex;justify-content:space-between}
.candle{position:relative;width:34px;height:58px;margin-top:-58px;border:0;background:none;padding:0;cursor:pointer;
  display:flex;justify-content:center;align-items:flex-end;-webkit-tap-highlight-color:transparent}
.candle:focus-visible{outline:2px solid var(--glow);outline-offset:4px;border-radius:8px}
.stick{width:10px;height:36px;border-radius:3px;background:repeating-linear-gradient(135deg,#fff 0 6px,var(--lilac) 6px 12px)}
.flame{position:absolute;top:0;width:16px;height:26px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
  background:radial-gradient(ellipse at 50% 75%,#fff6d6 0,var(--glow) 45%,#ff9a3c 100%);
  box-shadow:0 0 26px 10px rgba(255,211,122,.55);transform-origin:50% 100%;animation:flick .9s ease-in-out infinite alternate}
.candle:nth-child(2n) .flame{animation-duration:.7s}
.candle:nth-child(3n) .flame{animation-duration:1.1s}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.92,1.08) rotate(3deg)}}
.smoke{position:absolute;top:6px;width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:0}
.candle.out .flame{transform:scale(0);opacity:0;transition:transform .25s,opacity .25s;animation:none;box-shadow:none}
.candle.out .smoke{animation:smoke 1.6s ease-out}
@keyframes smoke{0%{opacity:.7;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-46px) scale(5)}}

/* letter */
.letter{margin:34px auto 0;padding:26px 22px;max-width:480px;border-radius:18px;background:rgba(255,241,230,.08);
  border:1px solid rgba(255,241,230,.22);text-align:left;opacity:0;transform:translateY(16px);transition:opacity .8s,transform .8s}
.letter.show{opacity:1;transform:none}
.letter p{margin:0 0 14px;line-height:1.75;font-size:1.02rem;max-width:62ch}
.letter .to{font-family:var(--script);font-size:1.7rem;line-height:1.3}
.letter .sign{font-family:var(--script);font-size:1.6rem;text-align:right;margin:6px 0 0}
.again{margin-top:20px;font:inherit;color:var(--ink);background:transparent;border:1px solid rgba(255,241,230,.4);border-radius:999px;padding:10px 20px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .6s}
.again.show{opacity:1;pointer-events:auto}
.again:hover{background:rgba(255,241,230,.12)}
.again:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:20px 16px;max-width:480px;margin:28px auto 0}
.pol{margin:0;padding:8px 8px 10px;background:var(--cream);color:#3b1a45;border:0;border-radius:4px;font:inherit;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.4);
  opacity:0;transform:translateY(26px) rotate(var(--r,0deg)) scale(.9);transition:opacity .7s,transform .7s}
.pol.show{opacity:1;transform:rotate(var(--r,0deg))}
.pol:focus-visible{outline:2px solid var(--glow);outline-offset:4px}
.pol .ph{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;background:linear-gradient(135deg,#ffd9e0,#e4d9ff);font-size:2rem;color:var(--berry)}
.pol .ph small{font-size:.72rem;color:#6b4a7a}
.pol img{width:100%;height:100%;object-fit:cover;display:block}
.pol .cap{display:block;margin-top:6px;font-family:var(--script);font-size:1.25rem;line-height:1.2}
@media (prefers-reduced-motion:reduce){.pol{transition:none}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.heart{position:fixed;bottom:-30px;color:var(--berry);pointer-events:none;z-index:4;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.flame{animation:none}.letter{transition:none}}
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="hint" id="hint">Chạm vào từng ngọn nến để thổi tắt</p>

  <div class="cake" aria-label="Chiếc bánh sinh nhật">
    <div class="candles" id="candles"></div>
    <div class="layer l2"><div class="drip"></div></div>
    <div class="layer l1"><div class="drip"></div><div class="dots"></div></div>
    <div class="plate"></div>
  </div>

  <section class="letter" id="letter" aria-live="polite"></section>
  <div class="gallery" id="gallery"></div>
  <input type="file" id="file" accept="image/*" hidden>
  <button class="again" id="again" type="button">Thổi nến lại</button>
</main>
<canvas id="fx" aria-hidden="true"></canvas>

<script>

const CONFIG = {
  name: "Hương Giang",          
  from: "Nghĩa",            
  candles: 5,              
  message: [
    "Cảm ơn em vì đã xuất hiện trong cuộc đời anh, làm những ngày bình thường trở nên đáng nhớ.",
    "Mong năm mới của em có thật nhiều tiếng cười, ít muộn phiền, và luôn có anh bên cạnh.",
    "Chúc em giang đạt điểm cao trong học tập, thành công trong công việc, và hạnh phúc trong tình yêu.",
    "Điều ước của anh năm nay rất đơn giản: được cùng thổi nến và ăn sinh nhật cùng em "
  ],
  photos: [
    { src: "anh1.jpg", caption: "thả tim" },
    { src: "anh2.jpg", caption: "Ngày chụp kỉ yếu" },
    { src: "anh3.jpg", caption: "Em quạc" },
    { src: "anh4.jpg", caption: "Chụp ảnh cùng bạn" }
  ]
};
/* ======================= */

const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let left = 0, typing = 0;

$("title").textContent = "Chúc mừng sinh nhật, " + CONFIG.name + "!";

function setup(){
  typing++;
  const box = $("candles"); box.innerHTML = "";
  $("letter").classList.remove("show"); $("letter").innerHTML = "";
  buildGallery();
  $("again").classList.remove("show");
  $("hint").textContent = "Chạm vào từng ngọn nến để thổi tắt";
  left = CONFIG.candles;
  for(let i = 0; i < CONFIG.candles; i++){
    const b = document.createElement("button");
    b.className = "candle"; b.type = "button"; b.setAttribute("aria-label", "Thổi nến " + (i+1));
    b.innerHTML = '<span class="flame"></span><span class="smoke"></span><span class="stick"></span>';
    b.addEventListener("click", () => blow(b), {once:true});
    box.appendChild(b);
  }
}

function blow(c){
  c.classList.add("out");
  left--;
  $("hint").textContent = left > 0 ? "Còn " + left + " ngọn nữa, thổi tiếp nào" : "Điều ước của em đã được gửi đi";
  if(left === 0) setTimeout(celebrate, 700);
}

function celebrate(){
  confetti(); hearts();
  const L = $("letter"); L.innerHTML = ""; L.classList.add("show");
  const lines = [["to", "Gửi " + CONFIG.name + ","], ...CONFIG.message.map(t => ["", t]), ["sign", "— " + CONFIG.from]];
  const id = ++typing; let i = 0;
  (function next(){
    if(id !== typing || i >= lines.length){ if(id === typing) revealPhotos(id); return; }
    const [cls, text] = lines[i++];
    const p = document.createElement("p"); if(cls) p.className = cls; L.appendChild(p);
    let k = 0;
    (function type(){
      if(id !== typing) return;
      if(reduce){ p.textContent = text; return next(); }
      p.textContent = text.slice(0, ++k);
      if(k < text.length) setTimeout(type, 28); else setTimeout(next, 350);
    })();
  })();
}

/* confetti */
function confetti(){
  if(reduce) return;
  const cv = $("fx"), g = cv.getContext("2d");
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ["#ffd37a","#ff5d7a","#c9b8ff","#fff1e6","#7ee0c3"];
  const ps = Array.from({length:140}, () => ({
    x:W/2 + (Math.random()-.5)*80, y:H*.45, vx:(Math.random()-.5)*14, vy:-Math.random()*14-4,
    s:Math.random()*7+4, r:Math.random()*6, vr:(Math.random()-.5)*.4, c:cols[Math.random()*cols.length|0]
  }));
  let t = 0;
  (function f(){
    g.clearRect(0,0,W,H);
    ps.forEach(p => {
      p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); g.restore();
    });
    if(++t < 220) requestAnimationFrame(f); else g.clearRect(0,0,W,H);
  })();
}

function hearts(){
  if(reduce) return;
  for(let i = 0; i < 14; i++){
    const h = document.createElement("span");
    h.className = "heart"; h.textContent = "♥";
    h.style.left = Math.random()*100 + "vw";
    h.style.fontSize = (14 + Math.random()*20) + "px";
    h.style.animationDuration = (5 + Math.random()*5) + "s";
    h.style.animationDelay = (Math.random()*2.5) + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 11000);
  }
}

let pick = 0;
function buildGallery(){
  const g = $("gallery"); g.innerHTML = "";
  CONFIG.photos.slice(0,4).forEach((p, i) => {
    let src = p.src;
    try{ src = localStorage.getItem("photo" + i) || src; }catch(e){}
    const b = document.createElement("button");
    b.type = "button"; b.className = "pol"; b.style.setProperty("--r", [-4,3,2,-3][i] + "deg");
    b.setAttribute("aria-label", "Ảnh " + (i+1) + ": " + p.caption + ". Chạm để đổi ảnh");
    const ph = document.createElement("div"); ph.className = "ph";
    setPhoto(ph, src);
    const cap = document.createElement("span"); cap.className = "cap"; cap.textContent = p.caption;
    b.append(ph, cap);
    b.addEventListener("click", () => { pick = i; $("file").click(); });
    g.appendChild(b);
  });
}
function setPhoto(ph, src){
  ph.innerHTML = "";
  if(src){ const im = document.createElement("img"); im.alt = ""; im.src = src; ph.appendChild(im); }
  else { ph.innerHTML = "♥<small>Chạm để chọn ảnh</small>"; }
}
$("file").addEventListener("change", e => {
  const f = e.target.files[0]; e.target.value = ""; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 900 / Math.max(im.width, im.height));
      const c = document.createElement("canvas"); c.width = im.width * k; c.height = im.height * k;
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      const url = c.toDataURL("image/jpeg", .82);
      setPhoto(document.querySelectorAll(".pol .ph")[pick], url);
      try{ localStorage.setItem("photo" + pick, url); }catch(err){}
    };
    im.src = r.result;
  };
  r.readAsDataURL(f);
});
function revealPhotos(id){
  const ps = [...document.querySelectorAll(".pol")];
  ps.forEach((p, i) => setTimeout(() => { if(id === typing) p.classList.add("show"); }, reduce ? 0 : i * 550));
  if(ps[0]) ps[0].scrollIntoView({behavior: reduce ? "auto" : "smooth", block: "center"});
  setTimeout(() => { if(id === typing) $("again").classList.add("show"); }, reduce ? 0 : ps.length * 550 + 300);
}

$("again").addEventListener("click", setup);
setup();
</script>
</body>
</html>
